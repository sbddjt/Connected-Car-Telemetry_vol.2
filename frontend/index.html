<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>차량 최신 정보 · Telemetry v2</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/vehicle_state.js" defer></script>
<script src="/dashboard.js" defer></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">CONNECTED CAR · VOL.2</p><h1>차량 최신 정보</h1>
      <p class="subtitle">마지막으로 관측된 위치와 속도를 확인합니다.</p></div>
      <span class="source">Redis 최신 상태 · 1초 조회</span></header>
    <section class="toolbar" aria-label="조회 설정">
      <form id="search-form"><label for="vehicle-id">차량 ID</label>
        <div class="search"><input id="vehicle-id" placeholder="차량 ID로 조회" autocomplete="off">
          <button type="submit">조회</button><button id="show-all" type="button" class="secondary">전체</button></div>
      </form>
      <fieldset><legend>표시할 정보</legend>
        <label><input id="show-location" type="checkbox" checked> 위치</label>
        <label><input id="show-speed" type="checkbox" checked> 속도</label>
      </fieldset>
      <label class="auto"><input id="auto-refresh" type="checkbox" checked> 최신 상태 주기 조회</label>
    </section>
    <div class="summary"><span id="count">차량 조회 중</span><span id="status" role="status" aria-live="polite">연결 확인 중…</span></div>
    <section class="panel" aria-label="차량 정보">
      <div class="table-wrap"><table><thead><tr>
        <th>차량 ID</th><th id="location-heading">위치 · 위도 / 경도</th>
        <th id="speed-heading">속도 · km/h</th><th>최근 관측</th>
      </tr></thead><tbody id="vehicles"></tbody></table></div>
      <p id="empty" hidden>아직 조회할 차량이 없습니다. 데이터 수집과 최신 상태 갱신 작업을 실행해 주세요.</p>
      <div class="pagination"><button id="previous" class="secondary" type="button">이전</button>
        <span id="page">1페이지</span><button id="next" class="secondary" type="button">다음</button></div>
    </section>
    <p class="note">위치와 속도의 관측 시각은 다를 수 있습니다. 오래된 관측은 연결 종료를 뜻하지 않으며, 값이 바뀌지 않은 차량도 오래된 시각으로 표시될 수 있습니다.</p>
  </main>
</body>
</html>
