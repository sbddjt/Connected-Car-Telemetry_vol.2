apiVersion: "v1"
kind: "Service"
metadata:
  name: "kafka"
  namespace: "telemetry-v2"
spec:
  selector:
    app: "kafka"
  ports:
    -
      name: "tcp"
      port: 9092
      targetPort: 9092
  clusterIP: "None"
  publishNotReadyAddresses: true
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "kafka"
  namespace: "telemetry-v2"
spec:
  serviceName: "kafka"
  replicas: 3
  selector:
    matchLabels:
      app: "kafka"
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: "Retain"
    whenScaled: "Retain"
  template:
    metadata:
      labels:
        app: "kafka"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "kafka"
          image: "apache/kafka:4.3.1"
          imagePullPolicy: "IfNotPresent"
          command:
            - "/bin/bash"
            - "-ec"
          args:
            - "export KAFKA_NODE_ID=\"$((${HOSTNAME##*-}+1))\"\nexport KAFKA_ADVERTISED_LISTENERS=\"PLAINTEXT://${HOSTNAME}.kafka:9092\"\nexec /etc/kafka/docker/run"
          ports:
            -
              name: "broker"
              containerPort: 9092
            -
              name: "controller"
              containerPort: 9093
          env:
            -
              name: "CLUSTER_ID"
              value: "4L6g3nShT-eMCtK--X86sw"
            -
              name: "KAFKA_PROCESS_ROLES"
              value: "broker,controller"
            -
              name: "KAFKA_CONTROLLER_QUORUM_VOTERS"
              value: "1@kafka-0.kafka:9093,2@kafka-1.kafka:9093,3@kafka-2.kafka:9093"
            -
              name: "KAFKA_LISTENERS"
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            -
              name: "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP"
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            -
              name: "KAFKA_INTER_BROKER_LISTENER_NAME"
              value: "PLAINTEXT"
            -
              name: "KAFKA_CONTROLLER_LISTENER_NAMES"
              value: "CONTROLLER"
            -
              name: "KAFKA_DEFAULT_REPLICATION_FACTOR"
              value: "3"
            -
              name: "KAFKA_MIN_INSYNC_REPLICAS"
              value: "2"
            -
              name: "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR"
              value: "3"
            -
              name: "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR"
              value: "3"
            -
              name: "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR"
              value: "2"
            -
              name: "KAFKA_AUTO_CREATE_TOPICS_ENABLE"
              value: "false"
            -
              name: "KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE"
              value: "false"
            -
              name: "KAFKA_LOG_DIRS"
              value: "/var/lib/kafka/data"
            -
              name: "KAFKA_LOG_RETENTION_HOURS"
              value: "-1"
            -
              name: "KAFKA_LOG_RETENTION_BYTES"
              value: "-1"
            -
              name: "KAFKA_HEAP_OPTS"
              value: "-Xms256m -Xmx512m"
            -
              name: "KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS"
              value: "0"
          resources:
            requests:
              cpu: "100m"
              memory: "640Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/kafka"
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
            failureThreshold: 60
      securityContext:
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            -
              weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: "kafka"
                topologyKey: "kubernetes.io/hostname"
  volumeClaimTemplates:
    -
      metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "5Gi"
  podManagementPolicy: "Parallel"
