apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "receiver"
  namespace: "telemetry-v2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "receiver"
  template:
    metadata:
      labels:
        app: "receiver"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        -
          name: "receiver"
          image: "sbddjt/connected-car-telemetry-v2:v0.1.0"
          imagePullPolicy: "IfNotPresent"
          args:
            - "receiver"
          envFrom:
            -
              configMapRef:
                name: "telemetry-runtime"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            -
              name: "runtime"
              mountPath: "/app/data"
            -
              name: "tmp"
              mountPath: "/tmp"
          ports:
            -
              containerPort: 8765
          readinessProbe:
            tcpSocket:
              port: 8765
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: 8765
            periodSeconds: 5
            failureThreshold: 24
      volumes:
        -
          name: "runtime"
          emptyDir: {}
        -
          name: "tmp"
          emptyDir: {}
---
